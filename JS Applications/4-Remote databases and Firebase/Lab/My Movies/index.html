<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My movies</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2 id="header">Please log in!</h2>

    <div id="login-form">
        <label for="username">Username: </label>
        <input type="text" id="username" />
        <label for="password">Password: </label>
        <input type="password" id="password">
        <button id="login-button">Login</button>
    </div>

    <div class="add-movie">
        <h2 class="add-header">Add a movie!</h2>
        <label for="title">Title: </label>
        <input type="text" id="title" />
        <label for="actor">Actor: </label>
        <input type="text" id="actor">
        <label for="actor">Image url: </label>
        <input type="text" id="image-url">
        <button id="add-movie-button">Add</button>
    </div>

    <ul id="movies"></ul>

    <h2>Movie details</h2>
    <div id="movie-details">Please select movie!</div>

    <script type="module" src="auth.js"></script>

    <script type="module">
        const baseUrl = 'https://movies-2024-ad36f-default-rtdb.europe-west1.firebasedatabase.app';
        let moviesEl = document.getElementById('movies');
        let movieDetailsEl = document.getElementById('movie-details');
        let addMovieBut = document.getElementById('add-movie-button');

        fetch(`${baseUrl}/movies.json`)
            .then(res => res.json())
            .then(data => {
                let movieTitles = Object
                    .keys(data)
                    .map(key => `<li class="movie-item" data-key=${key}>${data[key].title}</li>`)
                    .join('');

                moviesEl.innerHTML = movieTitles;
            });

        moviesEl.addEventListener('click', function (e) {
            // e.target.getAttribute('data-key')); // Or
            let movieId = e.target.dataset.key;

            // console.log(`${baseUrl}/movies/${movieId}.json`);

            fetch(`${baseUrl}/movies/${movieId}.json`)
                .then(res => res.json())
                .then(movie => {
                    movieDetailsEl.innerHTML = `Selected movie: ${movie.title}`;
                });
        });

        addMovieBut.addEventListener('click', function (e) {
            let titleEl = document.getElementById('title');
            let actorEl = document.getElementById('actor');
            let imgUrlEl = document.getElementById('image-url');

            let newMovie = {
                title: titleEl.value,
                actor: actor.value,
                imageUrl: imgUrlEl.value,
            }

            fetch(`${baseUrl}/movies.json`, {
                method: 'POST',
                body: JSON.stringify(newMovie)
            })
                .then(res => res.json())
                .then(res => {
                    console.log(res.name);

                    let newMovieEl = document.createElement('li');
                    newMovieEl.textContent = newMovie.title;

                    newMovieEl.dataset['key'] = res.name;
                    newMovieEl.classList.add('movie-item');

                    moviesEl.appendChild(newMovieEl);
                })
                .catch(err => console.log(err))
        });
    </script>

</body>

</html>
