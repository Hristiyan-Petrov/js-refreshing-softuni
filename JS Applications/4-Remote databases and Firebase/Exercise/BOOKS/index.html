<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Books</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <section id="authentication">
        <form id="login">
            <h2 class="login-header">Login</h2>
            <input type="email" id="login-email" placeholder="Email...">
            <input type="password" id="login-password" placeholder="Password...">
            <button id="login-button" type="button">Login</button>
            <p class="error-message"></p>
        </form>
        <form id="register">
            <h2 class="register-header">Or if you don't have and account, Register</h2>
            <input type="email" id="register-email" placeholder="Email...">
            <input type="password" id="register-password" placeholder="Password...">
            <button id="register-button" type="button">Register</button>
        </form>
        <p class="error-message"></p>
    </section>

    <main id="main-wrapper">
        <h1 id="header-greet">Hello, </h1>
        <button id="logout-button">Logout</button>
        <button id="loadBooks">LOAD ALL BOOKS</button>

        <section id="table-wrapper">
            <p id="message">Books will load here</p>
        </section>

        <form id="add-book">
            <h3>FORM</h3>
            <label>TITLE</label>
            <input type="title" id="title" placeholder="Title...">
            <label>AUTHOR</label>
            <input type="title" id="author" placeholder="Author...">
            <label>ISBN</label>
            <input type="title" id="isbn" placeholder="Isnb...">
            <button id="add-button">Submit</button>
        </form>
    </main>



    <script type="module" src="./init-firebase.js"></script>
    <script type="module" src="./auth.js"></script>
    <script src="app.js"></script>
</body>

</html>
