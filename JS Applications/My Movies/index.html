<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My movies</title>
</head>

<body>
    <h2 id="header">Please log in!</h2>

    <div id="login-form">
        <label for="username">Username: </label>
        <input type="text" id="username" />
        <label for="password">Password: </label>
        <input type="password" id="password">
        <button id="login-button">Login</button>
    </div>

    <script type="module" src="config.js"></script>

    <script type="module">
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

        const auth = getAuth();

        let buttonEl = document.getElementById('login-button');
        buttonEl.addEventListener('click', onUserLogin)

        function onUserLogin(e) {
            let usernameEl = document.getElementById('username');
            let passwordEl = document.getElementById('password');
            let headerEl = document.getElementById('header');
            let loginFormEl = document.getElementById('login-form');


            auth.signInWithEmailAndPassword(auth, usernameEl.value, passwordEl.value)
                .then(res => {
                    console.log('logged in');
                    console.log(res);
                    headerEl.innerText = `Hello, ${res.user.email}`;
                    loginFormEl.style.display = 'none';
                })
                .catch(err => {
                    console.log(err);
                })
        }
    </script>

</body>

</html>
