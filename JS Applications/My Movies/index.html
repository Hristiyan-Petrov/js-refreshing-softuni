<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My movies</title>
</head>

<body>
    <h2 id="header">Please log in!</h2>

    <div id="login-form">
        <label for="username">Username: </label>
        <input type="text" id="username" />
        <label for="password">Password: </label>
        <input type="password" id="password">
        <button id="login-button">Login</button>
    </div>

    <ul id="movies"></ul>

    <script type="module" src="auth.js"></script>

    <script type="module">
        const baseUrl = 'https://movies-2024-ad36f-default-rtdb.europe-west1.firebasedatabase.app';
        let moviesEl = document.getElementById('movies');

        fetch(`${baseUrl}/movies.json`)
            .then(res => res.json())
            .then(data => {
                let movieTitles = Object
                    .keys(data)
                    .map(x => `<li>${data[x].title}</li>`)
                    .join('');

                moviesEl.innerHTML = movieTitles;
            });
    </script>

</body>

</html>
