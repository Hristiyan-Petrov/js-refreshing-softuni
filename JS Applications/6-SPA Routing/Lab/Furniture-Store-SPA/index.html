<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Animations&Interceptors Exercise</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" type="text/css"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" type="text/css" href="https://bootswatch.com/4/lux/bootstrap.min.css">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.slim.min.js"></script>

  <!-- Popper.js - used for hamburger menu on mobile version-->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>

  <!-- Then Bootstrap JS -->
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

  <!-- Handlebars -->
  <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
</head>

<body id="main">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="furniture/all">All Furniture store </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item active">
          <a class="nav-link" href="furniture/create">Create a Furniture</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">[ ]</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">[ ]</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Content container -->
  <div id="container">

    <!-- All furniture template -->
    <div class="container">
      <div class="row space-top">
        <div class="col-md-12">
          <h1>Welcome to Furniture System</h1>
          <p>Select furniture from the catalog to view details.</p>
        </div>
      </div>

      <!-- Furniture item template (maybe will be included as Partial in 'All furniture template' ) -->
      <div class="row space-top">
        <div class="col-md-4">
          <div class="card text-white bg-primary">
            <div class="card-body">
              <blockquote class="card-blockquote">
                <img src="{{imageUrl}}" />
                <p>{{Description here}}</p>
                <footer>Someone famous in
                  <cite title="Source Title">Source Title</cite>
                </footer>
                <div class="pull-right">
                  <a href=”#” class="btn btn-info">Details</a>
                </div>
              </blockquote>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div id="notifications">
      <div id="loadingBox" class="notification">
        <span>Loading …</span>
      </div>
      <div id="infoBox" class="notification">
        <span>Info</span>
      </div>
      <div id="errorBox" class="notification">
        <span>Error</span>
      </div>
    </div>

    <script src="router.js"></script>

</body>

</html>
