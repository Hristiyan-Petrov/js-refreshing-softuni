<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Hello World</h1>

    <div id="root"></div>

    <a href="#" onclick="navigate(event, 'home');">home</a>
    <a href="#" onclick="navigate(event, 'about');">about</a>
    <a href="#" onclick="navigate(event, 'contact');">contact</a>

    <button id="change">Change</button>

    <script>
        const rootElement = document.getElementById('root');

        const router = {
            '/home': '<h2>Home page</h2>',
            '/about': '<h2>About us</h2>',
            '/contact': '<h2>Contact us</h2>',
            '/changed': '<h2>Changed content</h2>',
        };

        window.addEventListener('popstate', e => {
            console.log('popstate event triggered');

            let path = location.pathname.substring(location.pathname.lastIndexOf('/'));

            rootElement.innerHTML = router[path] || '<h2>Not found!</h2>'
        });

        function navigate(e, url) {
            e && e.preventDefault();

            history.pushState({}, '', url);

            // Create custom popstate event

            let popstateEvent = new CustomEvent('popstate', {
                state: {},
                title: '',
                url
            });

            window.dispatchEvent(popstateEvent);
        }

        document.getElementById('change', () => {
            navigate(null, 'changed');
        });
    </script>
</body>

</html>
