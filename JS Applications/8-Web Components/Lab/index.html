<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plain JS Web Component Example</title>
    <script src="my-component.js" defer></script>
</head>

<body>
    <my-counter></my-counter>

    <!-- Template for the component markup -->
    <template id="my-counter-template">
        <style>
            :host {
              display: flex;
              align-items: center;
              gap: 10px;
              font-family: 'Poppins', sans-serif;
            }
      
            span {
              font-size: 2rem;
              font-weight: 600;
              color: #333;
            }
      
            button {
              padding: 10px 20px;
              background-color: #007bff;
              color: #fff;
              border: none;
              border-radius: 5px;
              font-size: 1rem;
              font-weight: 600;
              cursor: pointer;
              transition: background-color 0.3s ease;
            }
      
            button:hover {
              background-color: #0056b3;
            }
          </style>
        <span></span>
        <button>Increment</button>
    </template>

    <script type="module" src="./counter.js"></script>
</body>

</html>
