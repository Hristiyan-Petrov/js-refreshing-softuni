<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plain JS Web Component Example</title>
    <script src="my-component.js" defer></script>
</head>

<body>
    <my-counter></my-counter>

    <!-- Template for the component markup -->
    <template id="my-counter-template">
        <style>
            :host {
                display: flex;
                align-items: center;
                gap: 10px;
            }
        </style>
        <span></span>
        <button>Increment</button>
    </template>

    <script type="module" src="./counter.js"></script>
</body>

</html>
